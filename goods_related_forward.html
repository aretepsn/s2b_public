<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>페이지 이동 중...</title>
</head>
<body>
    <div id="message">데이터를 확인하고 있습니다. 잠시만 기다려 주세요...</div>

    <script>
        // 1. URL에서 파라미터 읽기 (예: ?code=123456)
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code'); 

        // 2. 기본 목적지 URL 설정
        const baseUrl = "https://www.s2b.kr/S2BNCustomer/rema100No.do?forwardName=detail&f_re_estimate_code=";

        if (code) {
            // 3. 파라미터가 있으면 해당 숫자를 붙여서 이동
            window.location.href = baseUrl + code;
        } else {
            // 4. 파라미터가 없을 경우 에러 메시지 출력
            document.getElementById('message').innerText = "잘못된 접근입니다. 코드가 확인되지 않습니다.";
        }
    </script>
</body>
</html>
